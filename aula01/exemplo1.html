<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 1 - CSS</title>

    <!-- LINKANDO O ARQUIVO CSS -->

    <link rel="stylesheet" href="estilo_exemplo1.css">
    <!-- CRIAR O ARQUIVO NA PASTA CHAMADO estilo_exemplo1.css -->

    <style>
        body
        {
            background-color: snow;
            
        }

        h1 
        {
            background-color: #ffc473;
            color: #ff8d1b;
            text-align: center;
            padding: 20px;
        }

        div
        {
            background-color: #ffc473;
            border-radius: 10px;
         margin: auto;
            width: 900px;
            text-align: center;
            text-size-adjust: auto;
            margin-bottom: 20px;

        }

        h3
        {
            color: #f47c05;
            text-align: center;

        }

        h2
        {
            color: #f47c05;
            text-align: center;
        }

    </style>
</head>

<body>

    <h1>Exemplo 1 - Trabalhando com CSS</h1>
    <!-- TITULO/ROTULO PARA A DIV-->
    
    <div class="conteudo">
        
        <h2>Sobre CSS</h2>

        <p>
            O CSS é utilizado para definir a aparência
            dos elementos de uma página HTML.
        </p>

        <p>
            Podemos alterar as <b>cores</b>,
            os tamanhos, as fontes e os espaçamentos.
        </p>

    </div>

    <div class="conteudo">



    </div>
    
</body>
</html>
